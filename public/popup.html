<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apple Music Duplicate Finder</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow-row">
          <div class="eyebrow">READ-ONLY PLAYLIST SCANNER</div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme: Auto. Switch to Light.">Theme: Auto</button>
        </div>
        <h1>Apple Music<br> <span>Duplicate Finder</span></h1>
      </header>
      <section class="playlist" aria-labelledby="playlist-label">
        <h2 id="playlist-label">Current playlist</h2>
        <p id="playlist-name">Detecting playlist…</p>
      </section>
      <button id="scan" type="button" disabled>Scan for Duplicates</button>
      <button id="cancel" class="secondary" type="button" hidden>Cancel scan</button>
      <section id="status" aria-live="polite" aria-atomic="true">
        <h2 id="status-title">Connecting to Apple Music…</h2>
        <p id="status-detail">Keep this popup open while scanning.</p>
        <p id="status-code" hidden></p>
        <progress id="scan-progress" aria-label="Playlist scan progress" hidden></progress>
      </section>
      <section id="results" hidden aria-labelledby="results-title">
        <div class="results-head">
          <h2 id="results-title" aria-live="polite">Repeated songs</h2>
          <label class="visually-hidden" for="results-min">Minimum copies</label>
          <select id="results-min">
            <option value="2">2+ copies</option>
            <option value="3">3+ copies</option>
            <option value="4">4+ copies</option>
            <option value="5">5+ copies</option>
          </select>
        </div>
        <div id="results-toolbar">
          <label class="visually-hidden" for="results-search">Search repeated songs</label>
          <input id="results-search" type="search" placeholder="Search song or artist" autocomplete="off" spellcheck="false">
          <label class="visually-hidden" for="results-sort">Sort repeated songs</label>
          <select id="results-sort">
            <option value="playlist">Playlist order</option>
            <option value="copies">Most copies</option>
            <option value="song">Song A–Z</option>
            <option value="artist">Artist A–Z</option>
          </select>
          <div class="result-actions">
            <button id="copy-results" class="secondary" type="button" aria-label="Copy visible results">Copy</button>
            <button id="download-results" class="secondary" type="button" aria-label="Download visible results as CSV">CSV</button>
          </div>
        </div>
        <p id="results-feedback" role="status" aria-live="polite"></p>
        <p id="results-empty" hidden>No matching songs. Try a different search or filter.</p>
        <div id="results-scroll" tabindex="0" role="region" aria-label="Duplicate songs and playlist positions">
          <p id="scan-notes" hidden></p>
          <ul id="duplicate-list"></ul>
        </div>
        <button id="show-more" class="secondary" type="button" hidden>Show more duplicates</button>
      </section>
      <button id="clear-results" class="secondary" type="button" aria-label="Clear results" hidden>Clear results</button>
      <footer>Only looks. Never changes your music. <span id="version" class="version"></span></footer>
    </main>
  </body>
</html>

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.8.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - name: Audit dependencies for high-severity advisories
        run: npm run audit
      # Browser, extension and packaging suites need a pinned Chromium; they run on
      # one matrix entry while every supported Node version still typechecks and tests.
      - name: Install pinned Chromium and operating-system dependencies
        if: matrix.node == '24'
        run: npx --no-install playwright install --with-deps chromium
      - name: Typecheck, unit tests, fixtures, installed extension, production build and package verification
        if: matrix.node == '24'
        run: npm run check
      - name: Typecheck and unit tests
        if: matrix.node != '24'
        run: npm run typecheck && npm test

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run audit
      - run: npx --no-install playwright install chromium
      - run: npm run check
